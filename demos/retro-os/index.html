<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>RetroVoice OS</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; }
  body {
    font: 12px Tahoma, "MS Sans Serif", Geneva, sans-serif;
    background: #008080;
    display: flex; flex-direction: column;
    user-select: none;
  }
  #desktop { flex: 1; position: relative; overflow: hidden; }

  /* --- windows --- */
  .win {
    position: absolute; display: flex; flex-direction: column;
    background: #c0c0c0; padding: 3px;
    border-top: 2px solid #fff; border-left: 2px solid #fff;
    border-right: 2px solid #404040; border-bottom: 2px solid #404040;
    box-shadow: 1px 1px 0 #000;
    min-width: 180px; min-height: 100px;
  }
  .titlebar {
    display: flex; align-items: center; gap: 4px;
    background: linear-gradient(90deg, #000080, #1084d0);
    color: #fff; font-weight: bold; padding: 2px 3px; cursor: default;
  }
  .titlebar .ticon { font-size: 12px; }
  .titlebar .tname { flex: 1; overflow: hidden; white-space: nowrap; }
  .tbtn {
    width: 16px; height: 14px; font-size: 9px; line-height: 11px;
    text-align: center; color: #000; background: #c0c0c0; cursor: pointer;
    border-top: 1px solid #fff; border-left: 1px solid #fff;
    border-right: 1px solid #404040; border-bottom: 1px solid #404040;
  }
  .tbtn:active { border-top: 1px solid #404040; border-left: 1px solid #404040;
                 border-right: 1px solid #fff; border-bottom: 1px solid #fff; }
  .menubar { display: flex; gap: 10px; padding: 3px 5px; }
  .menubar span:hover { background: #000080; color: #fff; }
  .winbody { flex: 1; display: flex; flex-direction: column; min-height: 0; }
  .notepad-text {
    flex: 1; resize: none; outline: none; border: 0; padding: 4px;
    font: 13px "Courier New", monospace; background: #fff; color: #000;
    border-top: 2px solid #808080; border-left: 2px solid #808080;
    border-right: 2px solid #fff; border-bottom: 2px solid #fff;
    user-select: text;
  }

  /* --- code editor --- */
  .ed-toolbar { display: flex; gap: 6px; padding: 3px 4px; align-items: center; }
  .ed-toolbar .curfile { font-weight: bold; font-size: 11px; }
  .ed-toolbar .sbx { font-size: 10px; color: #444; margin-left: auto; }
  .ed-error-toggle {
    padding: 1px 7px; font: 10px Tahoma, sans-serif; cursor: pointer;
    background: #c0c0c0; color: #222;
    border-top: 1px solid #fff; border-left: 1px solid #fff;
    border-right: 1px solid #404040; border-bottom: 1px solid #404040;
  }
  .ed-error-toggle.has-errors { color: #a00000; font-weight: bold; }
  .ed-error-toggle.active {
    border-top: 1px solid #404040; border-left: 1px solid #404040;
    border-right: 1px solid #fff; border-bottom: 1px solid #fff;
    background: #e0e0e0;
  }
  .ed-error-clear { display: none; }
  .ed-error-clear.visible { display: inline-block; }
  .ed-main { flex: 1.4; display: flex; gap: 3px; min-height: 0; }
  .ed-tree {
    width: 150px; overflow: auto; background: #fff; padding: 3px 0;
    font: 11px Tahoma, sans-serif;
    border-top: 2px solid #808080; border-left: 2px solid #808080;
    border-right: 2px solid #fff; border-bottom: 2px solid #fff;
  }
  .ed-tree .titem { padding: 1px 6px; white-space: nowrap; cursor: default; }
  .ed-tree .titem.file { cursor: pointer; }
  .ed-tree .titem.file:hover { background: #d0d8e8; }
  .ed-tree .titem.sel { background: #000080; color: #fff; }
  .ed-tree .empty { color: #888; padding: 3px 6px; font-style: italic; }
  .ed-code {
    flex: 1; resize: none; outline: none; border: 0; padding: 4px;
    font: 12px "Courier New", monospace; background: #fff; color: #000;
    border-top: 2px solid #808080; border-left: 2px solid #808080;
    border-right: 2px solid #fff; border-bottom: 2px solid #fff;
    white-space: pre; overflow: auto; user-select: text;
  }
  .ed-errors {
    display: none; flex: 1; overflow: auto; padding: 6px;
    font: 12px "Courier New", monospace; white-space: pre-wrap;
    user-select: text; background: #fff; color: #800000;
    border-top: 2px solid #808080; border-left: 2px solid #808080;
    border-right: 2px solid #fff; border-bottom: 2px solid #fff;
  }
  .ed-main.error-mode .ed-tree, .ed-main.error-mode .ed-code { display: none; }
  .ed-main.error-mode .ed-errors { display: block; }
  .ed-term {
    flex: 1; overflow-y: auto; background: #000; color: #c7c7c7;
    font: 11px "Courier New", monospace; padding: 4px 6px; margin-top: 3px;
    border-top: 2px solid #808080; border-left: 2px solid #808080;
    border-right: 2px solid #fff; border-bottom: 2px solid #fff;
    white-space: pre-wrap; user-select: text;
  }
  .ed-term .cmd { color: #6fdc6f; }

  /* --- viewers --- */
  .imgwrap {
    flex: 1; overflow: auto; display: flex; align-items: center;
    justify-content: center; background: #fff;
    border-top: 2px solid #808080; border-left: 2px solid #808080;
    border-right: 2px solid #fff; border-bottom: 2px solid #fff;
  }
  .imgwrap img { max-width: 100%; max-height: 100%; }
  .prev-bar { display: flex; gap: 5px; padding: 3px 4px; align-items: center; }
  .prev-bar .url {
    flex: 1; background: #fff; padding: 2px 6px; font-size: 11px;
    overflow: hidden; white-space: nowrap;
    border-top: 2px solid #808080; border-left: 2px solid #808080;
    border-right: 2px solid #fff; border-bottom: 2px solid #fff;
  }
  .prev-frame { flex: 1; border: 0; background: #fff;
    border-top: 2px solid #808080; border-left: 2px solid #808080;
    border-right: 2px solid #fff; border-bottom: 2px solid #fff; }
  .browser-bar { display: flex; gap: 4px; padding: 3px 4px; }
  .browser-bar button { width: 28px; }
  .browser-address {
    flex: 1; min-width: 0; padding: 2px 5px; font: 11px Tahoma, sans-serif;
    border-top: 2px solid #808080; border-left: 2px solid #808080;
    border-right: 2px solid #fff; border-bottom: 2px solid #fff;
  }
  .browser-viewport {
    flex: 1; min-height: 0; display: flex; align-items: flex-start;
    justify-content: center; overflow: hidden; background: #fff;
    border-top: 2px solid #808080; border-left: 2px solid #808080;
    border-right: 2px solid #fff; border-bottom: 2px solid #fff;
  }
  .browser-shot { display: block; width: 100%; height: 100%; min-width: 0; min-height: 0; object-fit: fill; }

  /* --- assistant window --- */
  #assistant .winbody { padding: 4px; gap: 4px; }
  #statusline {
    background: #fff; padding: 3px 6px; font-weight: bold;
    border-top: 2px solid #808080; border-left: 2px solid #808080;
    border-right: 2px solid #fff; border-bottom: 2px solid #fff;
  }
  #perfline {
    background: #e8e8e8; padding: 2px 6px; color: #444;
    font: 10px "Courier New", monospace; white-space: nowrap;
    overflow: hidden; text-overflow: ellipsis;
    border-top: 1px solid #fff; border-left: 1px solid #fff;
    border-right: 1px solid #808080; border-bottom: 1px solid #808080;
  }
  #feed {
    flex: 1; overflow-y: auto; background: #fff; padding: 4px 6px;
    font: 11px "Courier New", monospace; color: #222;
    border-top: 2px solid #808080; border-left: 2px solid #808080;
    border-right: 2px solid #fff; border-bottom: 2px solid #fff;
    user-select: text;
  }
  #feed .you { color: #000080; font-weight: bold; }
  #feed .bot { color: #005500; }
  #feed .sys { color: #888; }
  #feed .tool { color: #aa5500; }
  #feed .perf { color: #555; }

  /* --- taskbar --- */
  #taskbar {
    height: 30px; background: #c0c0c0; display: flex; align-items: center;
    gap: 4px; padding: 2px 4px; border-top: 2px solid #fff;
  }
  #startbtn, .taskitem {
    height: 24px; padding: 0 10px; background: #c0c0c0; font-weight: bold;
    border-top: 2px solid #fff; border-left: 2px solid #fff;
    border-right: 2px solid #404040; border-bottom: 2px solid #404040;
    cursor: pointer; display: flex; align-items: center; gap: 5px;
    font-size: 12px;
  }
  #startbtn:active, .taskitem:active {
    border-top: 2px solid #404040; border-left: 2px solid #404040;
    border-right: 2px solid #fff; border-bottom: 2px solid #fff;
  }
  .taskitem { font-weight: normal; max-width: 160px; overflow: hidden;
              white-space: nowrap; }
  #clock {
    margin-left: auto; height: 24px; padding: 0 10px; display: flex;
    align-items: center; font-size: 12px;
    border-top: 2px solid #808080; border-left: 2px solid #808080;
    border-right: 2px solid #fff; border-bottom: 2px solid #fff;
  }
  #micdot { width: 10px; height: 10px; border-radius: 50%;
            background: #555; margin-right: 6px; }
  #micdot.live { background: #2bd42b; }
  #micdot.hot { background: #ff3b30; }

  /* --- boot dialog --- */
  #boot {
    position: absolute; inset: 0; display: flex; align-items: center;
    justify-content: center; background: #008080; z-index: 9999;
  }
  #bootwin { position: static; width: 380px; }
  #bootwin .winbody { padding: 16px; text-align: center; }
  #bootwin p { margin-bottom: 14px; line-height: 1.5; }
  #bootstart {
    padding: 6px 24px; font-weight: bold; cursor: pointer; background: #c0c0c0;
    border-top: 2px solid #fff; border-left: 2px solid #fff;
    border-right: 2px solid #404040; border-bottom: 2px solid #404040;
  }
</style>
<link rel="stylesheet" href="/vendor/xterm.css">
<style>
.workspace-toolbar { display:flex;gap:6px;align-items:center;padding:6px;flex-wrap:wrap; }
.workspace-toolbar input { min-width:100px;flex:1; }
.workspace-toolbar button,.workspace-row button { padding:3px 7px;cursor:pointer; }
.workspace-list { overflow:auto;flex:1;padding:8px; }
.workspace-row { padding:10px;margin-bottom:8px;border:1px solid #888;background:#ddd;display:flex;gap:6px;flex-wrap:wrap;align-items:center; }
.workspace-row > div { width:100%; }
.task-row { display:flex;align-items:center;gap:8px;border-top:1px solid #aaa;padding:6px 0; }
.task-row span { flex:1;white-space:pre-wrap;overflow-wrap:anywhere; }
.terminal-host { flex:1;min-height:0;background:#111820;padding:4px; }
.ed-toolbar { flex-wrap:wrap; }
.desktop-launcher { position:absolute;bottom:32px;left:4px;z-index:100000;background:#c0c0c0;border:2px outset white;padding:5px;display:flex;flex-direction:column;gap:4px;min-width:180px; }
.desktop-launcher button { text-align:left;padding:7px; }
</style>

<body>
<div id="desktop">
  <div id="boot">
    <div class="win" id="bootwin">
      <div class="titlebar"><span class="ticon">🖥️</span>
        <span class="tname">RetroVoice OS Setup</span></div>
      <div class="winbody">
        <p><b>Welcome to RetroVoice OS</b><br>
           A voice-controlled desktop. Ask the assistant to open a notepad,
           write notes, move windows around, or minimize them.</p>
        <button id="bootstart">▶ Start</button>
        <button id="bootmanual">Start without microphone</button>
        <p id="booterr" style="color:#800; margin-top:10px;"></p>
      </div>
    </div>
  </div>
</div>
<div id="taskbar">
  <div id="startbtn"><span id="micdot"></span>Start</div>
  <div id="clock">--:--</div>
</div>

<script src="/recording-client.js"></script>
<script src="/vendor/xterm.js"></script>
<script src="/vendor/addon-fit.js"></script>
<script src="/workspace-ui.js"></script>
<script src="/advanced-ui.js"></script>
<script>
const MIC_SR = 16000, TTS_SR = 24000;
const params = new URLSearchParams(location.search);
const SERVER = (params.get("server") || "http://localhost:8000")
  .replace(/^http/, "ws").replace(/\/$/, "") + "/ws";

let ws = null, micCtx = null, playCtx = null, micStream = null;
let playhead = 0, sources = [], zTop = 10;
let userSpeaking = false, thinking = false;
const interruptedUtts = new Set();

const desktop = document.getElementById("desktop");
const taskbar = document.getElementById("taskbar");
const clock = document.getElementById("clock");
setInterval(() => {
  clock.textContent = new Date().toTimeString().slice(0, 5);
}, 1000);

// ================= snap geometry =================
const SNAP_LAYOUTS = {
  left_half: [0, 1, 2], right_half: [1, 2, 2],
  left_third: [0, 1, 3], center_third: [1, 2, 3], right_third: [2, 3, 3],
  left_two_thirds: [0, 2, 3], right_two_thirds: [1, 3, 3],
  full: [0, 1, 1],
};
function snapGeometry(layout, width, height) {
  const parts = SNAP_LAYOUTS[layout];
  if (!parts) throw new Error(`Unknown snap layout: ${layout}`);
  const [start, end, count] = parts;
  const x = Math.round(width * start / count);
  return {left: `${x}px`, top: "0px", width: `${Math.round(width * end / count) - x}px`, height: `${height}px`};
}
// ================= retro window manager =================
function makeWindow({ title, icon, x, y, w, h, onMinimize, onClose }) {
  const win = document.createElement("div");
  win.className = "win";
  Object.assign(win.style, { left: x + "px", top: y + "px",
                             width: w + "px", height: h + "px", zIndex: ++zTop });
  const bar = document.createElement("div");
  bar.className = "titlebar";
  bar.innerHTML = `<span class="ticon">${icon}</span><span class="tname">${title}</span>`;
  const minBtn = document.createElement("div");
  minBtn.className = "tbtn"; minBtn.textContent = "_";
  bar.appendChild(minBtn);
  let closeBtn = null;
  if (onClose) {
    closeBtn = document.createElement("div");
    closeBtn.className = "tbtn"; closeBtn.textContent = "✕";
    bar.appendChild(closeBtn);
  }
  const snapSelect = document.createElement("select");
  snapSelect.setAttribute("aria-label", `Snap ${title}`);
  snapSelect.title = "Snap window to a desktop layout";
  snapSelect.style.cssText = "width:64px;font:10px Tahoma;color:#000";
  for (const [value, label] of [["", "Snap…"], ...Object.keys(SNAP_LAYOUTS).map(k => [k, k.replaceAll("_", " ")]), ["restore", "Restore size"]]) {
    const option = document.createElement("option"); option.value = value; option.textContent = label; snapSelect.append(option);
  }
  bar.insertBefore(snapSelect, minBtn);
  snapSelect.addEventListener("change", () => { if (snapSelect.value) snap(snapSelect.value); snapSelect.value = ""; });
  let snapLayout = null, unsnapped = null;
  function clearSnap() { snapLayout = null; unsnapped = null; win.style.minWidth = ""; win.style.minHeight = ""; }
  function applySnap() {
    if (!snapLayout) return;
    win.style.minWidth = "0"; win.style.minHeight = "0";
    Object.assign(win.style, snapGeometry(snapLayout, desktop.clientWidth, desktop.clientHeight));
  }
  function snap(layout) {
    if (layout !== "restore" && !SNAP_LAYOUTS[layout]) throw new Error(`Unknown snap layout: ${layout}`);
    if (layout === "restore") {
      if (unsnapped) Object.assign(win.style, unsnapped);
      clearSnap();
    } else {
      if (!snapLayout) unsnapped = Object.fromEntries(["left", "top", "width", "height"].map(k => [k, win.style[k]]));
      snapLayout = layout; applySnap();
    }
    restore(); scheduleDesktopSave();
  }
  const body = document.createElement("div");
  body.className = "winbody";
  win.append(bar, body);
  desktop.appendChild(win);

  win.addEventListener("mousedown", () => { win.style.zIndex = ++zTop; });
  bar.addEventListener("mousedown", e => {
    if (e.target === minBtn || e.target === closeBtn || e.target.closest("select")) return;
    const ox = e.clientX - win.offsetLeft, oy = e.clientY - win.offsetTop;
    const move = ev => {
      clearSnap();
      win.style.left = Math.max(0, ev.clientX - ox) + "px";
      win.style.top = Math.max(0, ev.clientY - oy) + "px";
    };
    const up = () => { document.removeEventListener("mousemove", move);
                       document.removeEventListener("mouseup", up);
                       scheduleDesktopSave(); };
    document.addEventListener("mousemove", move);
    document.addEventListener("mouseup", up);
  });
  minBtn.addEventListener("click", () => onMinimize ? onMinimize() : minimize());
  if (closeBtn) closeBtn.addEventListener("click", () => close());

  let taskBtn = null;
  function close() {
    if (onClose?.() === false) return false;
    if (taskBtn) { taskBtn.remove(); taskBtn = null; }
    win.remove();
    scheduleDesktopSave();
    return true;
  }
  function minimize() {
    if (win.style.display === "none") return "already minimized";
    win.style.display = "none";
    taskBtn = document.createElement("div");
    taskBtn.className = "taskitem";
    taskBtn.innerHTML = `<span>${icon}</span>${title}`;
    taskBtn.addEventListener("click", restore);
    taskbar.insertBefore(taskBtn, clock);
    scheduleDesktopSave();
    return "minimized";
  }
  function restore() {
    win.style.display = "flex";
    win.style.zIndex = ++zTop;
    if (taskBtn) { taskBtn.remove(); taskBtn = null; }
    scheduleDesktopSave();
  }
  return { el: win, body, minimize, restore, close, snap, applySnap, clearSnap,
           get snapLayout() { return snapLayout; }, get unsnapped() { return unsnapped; },
           restoreSnap(layout, previous) { if (SNAP_LAYOUTS[layout]) { snapLayout = layout; unsnapped = previous || null; applySnap(); } },
           get minimized() { return win.style.display === "none"; } };
}

// ================= window registry =================
// Every window (notepad, code editor, assistant) lives here under one id
// space; generic window tools operate on any of them.
const windows = {};
new ResizeObserver(() => {
  for (const w of Object.values(windows)) w.win.applySnap();
  scheduleDesktopSave();
}).observe(desktop);
let nextWindowId = 1;
const TAB_ID_KEY = "retrovoice-tab-id";
let tabId = sessionStorage.getItem(TAB_ID_KEY);
if (!tabId) {
  tabId = crypto.randomUUID();
  sessionStorage.setItem(TAB_ID_KEY, tabId);
}
const DESKTOP_STATE_KEY = `retrovoice-desktop-v1:${tabId}`;
let desktopStateReady = false;
let desktopSaveTimer = null;

function getWindow(id) { return windows[Number(id)] || null; }
function requireWindow(id, kind) {
  const w = getWindow(id);
  if (!w) return [null, `error: no window with window_id ${id}`];
  if (kind && w.kind !== kind)
    return [null, `error: window ${id} is a ${w.kind}, not a ${kind}`];
  return [w, null];
}

// ================= notepads =================
function openNotepad(forcedId = null) {
  const id = forcedId == null ? nextWindowId++ : Number(forcedId);
  nextWindowId = Math.max(nextWindowId, id + 1);
  const W = desktop.clientWidth, H = desktop.clientHeight;
  const win = makeWindow({
    title: `Untitled ${id} - Notepad`, icon: "📝",
    x: 24 + ((id - 1) % 5) * 32, y: 24 + ((id - 1) % 5) * 28,
    w: Math.round(W / 2), h: Math.round(H / 2),
    onClose: () => { delete windows[id]; feed("tool", `→ closed notepad ${id}`); },
  });
  const menu = document.createElement("div");
  menu.className = "menubar";
  menu.innerHTML = "<span>File</span><span>Edit</span><span>Help</span>";
  const ta = document.createElement("textarea");
  ta.className = "notepad-text";
  ta.spellcheck = false;
  ta.addEventListener("input", scheduleDesktopSave);
  win.body.append(menu, ta);
  windows[id] = { id, kind: "notepad", title: `Notepad ${id}`, win, ta };
  scheduleDesktopSave();
  return id;
}

// ================= code editors (docker sandboxes via backend) =================
async function api(method, url, body) {
  const r = await fetch(url, {
    method,
    headers: body ? { "Content-Type": "application/json" } : undefined,
    body: body ? JSON.stringify(body) : undefined,
  });
  if (!r.ok) {
    let detail = r.statusText;
    try { detail = (await r.json()).detail || detail; } catch (e) {}
    const error = new Error(detail);
    error.status = r.status;
    throw error;
  }
  return r.json();
}

function openEditorWindow(id, sandboxId, workspaceId = null) {
  const W = desktop.clientWidth, H = desktop.clientHeight;
  const win = makeWindow({
    title: `Code Editor ${id}`, icon: "💻",
    x: 40 + ((id - 1) % 4) * 36, y: 30 + ((id - 1) % 4) * 30,
    w: Math.round(W * 0.55), h: Math.round(H * 0.68),
    onClose: () => {
      if (windows[id]?.dirty) { termLine(windows[id], "Save or discard your edits before closing."); return false; }
      delete windows[id];
      feed("tool", `→ closed code editor ${id}`);
    },
  });
  const bar = document.createElement("div");
  bar.className = "ed-toolbar";
  const curfile = document.createElement("span");
  curfile.className = "curfile";
  curfile.textContent = "(no file open)";
  const errorToggle = document.createElement("button");
  errorToggle.className = "ed-error-toggle";
  errorToggle.textContent = "Errors (0)";
  errorToggle.title = "Toggle sandbox errors";
  const errorClear = document.createElement("button");
  errorClear.className = "ed-error-toggle ed-error-clear";
  errorClear.textContent = "Clear";
  errorClear.title = "Clear sandbox errors";
  const sbx = document.createElement("span");
  sbx.className = "sbx";
  sbx.textContent = `sandbox: ${sandboxId.replace("retrovoice-sbx-", "")}`;
  bar.append(curfile, errorToggle, errorClear, sbx);
  const main = document.createElement("div");
  main.className = "ed-main";
  const tree = document.createElement("div");
  tree.className = "ed-tree";
  tree.innerHTML = '<div class="empty">(no files yet)</div>';
  const code = document.createElement("textarea");
  code.className = "ed-code";
  code.readOnly = false; code.spellcheck = false;
  code.setAttribute("aria-label", "File contents");
  const errors = document.createElement("div");
  errors.className = "ed-errors";
  errors.textContent = "No sandbox errors.";
  main.append(tree, code, errors);
  const term = document.createElement("div");
  term.className = "ed-term";
  term.textContent = "sandbox ready — python:3.11-slim, workdir /workspace\n";
  win.body.append(bar, main, term);

  const ed = { id, kind: "code_editor", title: `Code Editor ${id}`,
               win, curfile, errorToggle, errorClear, main, tree, code, errors,
               term, sandboxId, workspaceId, dirty: false, savedContent: "",
               files: {}, knownFiles: [], current: null,
               errorLog: [], showingErrors: false, fallbackNotified: false };
  errorToggle.addEventListener("click", () => showErrorView(ed, !ed.showingErrors));
  errorClear.addEventListener("click", () => clearSandboxErrors(ed));
  windows[id] = ed;
  const save = actionButton("Save", async () => {
    if (!ed.current) throw new Error("Open or create a file first.");
    const content = ed.code.value;
    await api("POST", `/api/sandbox/${sandboxId}/file`, {path: ed.current, content, expected_content: ed.savedContent});
    ed.savedContent = content; ed.files[ed.current] = content;
    ed.dirty = ed.code.value !== content;
    termLine(ed, `Saved ${ed.current}`); scheduleDesktopSave();
  });
  code.addEventListener("input", () => { ed.dirty = code.value !== ed.savedContent; scheduleDesktopSave(); });
  code.addEventListener("keydown", e => { if ((e.metaKey || e.ctrlKey) && e.key === "s") { e.preventDefault(); save.click(); } });
  const filename = document.createElement("input"); filename.placeholder = "New file path"; filename.setAttribute("aria-label", "New file path");
  const create = actionButton("New file", async () => {
    if (ed.dirty) throw new Error("Save or discard edits first.");
    const path = normPath(filename.value.trim());
    if (!filename.value.trim()) throw new Error("Enter a file path.");
    try { await api("GET", `/api/sandbox/${sandboxId}/file?path=${encodeURIComponent(path)}`); throw new Error("File exists; open it from the tree."); }
    catch (e) { if (e.status !== 404) throw e; }
    await api("POST", `/api/sandbox/${sandboxId}/file`, {path, content: ""});
    setFile(ed, path, ""); filename.value = "";
  });
  bar.prepend(save, actionButton("Discard edits / reload", async () => {
    if (!ed.current) return;
    const r = await api("GET", `/api/sandbox/${sandboxId}/file?path=${encodeURIComponent(ed.current)}`);
    ed.dirty = false; setFile(ed, ed.current, r.content);
  }), actionButton("Refresh files", () => refreshTree(ed)),
  actionButton("Terminal", () => workspaceTerminal(ed.workspaceId)), filename, create);
  scheduleDesktopSave();
  return ed;
}

function showErrorView(ed, show) {
  ed.showingErrors = show;
  ed.main.classList.toggle("error-mode", show);
  ed.errorToggle.classList.toggle("active", show);
  ed.errorClear.classList.toggle("visible", show);
  ed.curfile.textContent = show
    ? "Sandbox Errors"
    : (ed.current ? ed.current.replace("/workspace/", "") : "(no file open)");
}

function clearSandboxErrors(ed) {
  ed.errorLog = [];
  ed.errors.textContent = "No sandbox errors.";
  ed.errorToggle.textContent = "Errors (0)";
  ed.errorToggle.classList.remove("has-errors");
  scheduleDesktopSave();
}

function recordSandboxError(ed, context, detail) {
  const stamp = new Date().toLocaleTimeString();
  const message = `[${stamp}] ${context}\n${String(detail || "unknown error")}`;
  ed.errorLog.push(message);
  if (ed.errorLog.length > 100) ed.errorLog.shift();
  ed.errors.textContent = ed.errorLog.join("\n\n");
  ed.errorToggle.textContent = `Errors (${ed.errorLog.length})`;
  ed.errorToggle.classList.add("has-errors");
  scheduleDesktopSave();
}

function windowSnapshot(w) {
  const base = {
    id: w.id, kind: w.kind,
    x: parseInt(w.win.el.style.left, 10) || 0,
    y: parseInt(w.win.el.style.top, 10) || 0,
    width: parseInt(w.win.el.style.width, 10) || w.win.el.offsetWidth,
    height: parseInt(w.win.el.style.height, 10) || w.win.el.offsetHeight,
    minimized: w.win.minimized,
    snap_layout: w.win.snapLayout,
    unsnapped: w.win.unsnapped,
  };
  if (w.kind === "notepad") base.text = w.ta.value;
  if (w.kind === "code_editor") {
    base.sandboxId = w.sandboxId;
    base.current = w.current;
    base.errorLog = w.errorLog;
    base.workspaceId = w.workspaceId;
    if (w.dirty) { base.draft = w.code.value; base.savedContent = w.savedContent; }
  }
  if (w.kind === "terminal") { base.workspaceId = w.workspaceId; base.terminalId = w.terminalId; }
  if (w.kind === "browser") {
    base.browserId = w.browserId;
    base.url = w.url;
  }
  return base;
}

function saveDesktopState() {
  if (!desktopStateReady) return;
  try {
    localStorage.setItem(DESKTOP_STATE_KEY, JSON.stringify({
      version: 1,
      nextWindowId,
      currentWorkspaceId,
      windows: Object.values(windows)
        .filter(w => ["assistant", "notepad", "code_editor", "browser", "terminal"].includes(w.kind))
        .map(windowSnapshot),
    }));
  } catch (error) {
    console.warn("could not save desktop state", error);
  }
}

function scheduleDesktopSave() {
  if (!desktopStateReady) return;
  clearTimeout(desktopSaveTimer);
  desktopSaveTimer = setTimeout(saveDesktopState, 100);
}

function applyWindowSnapshot(w, saved) {
  Object.assign(w.win.el.style, {
    left: `${Math.max(0, Number(saved.x) || 0)}px`,
    top: `${Math.max(0, Number(saved.y) || 0)}px`,
    width: `${Math.max(180, Number(saved.width) || 180)}px`,
    height: `${Math.max(100, Number(saved.height) || 100)}px`,
  });
  w.win.restoreSnap(saved.snap_layout, saved.unsnapped);
  if (saved.minimized) w.win.minimize();
}

async function restoreDesktopState() {
  let state;
  try {
    state = JSON.parse(localStorage.getItem(DESKTOP_STATE_KEY) || "null");
  } catch (error) {
    console.warn("could not restore desktop state", error);
    return false;
  }
  if (!state || state.version !== 1 || !Array.isArray(state.windows)) return false;
  currentWorkspaceId = state.currentWorkspaceId || null;

  const assistantSaved = state.windows.find(w => w.kind === "assistant");
  const assistant = Object.values(windows).find(w => w.kind === "assistant");
  if (assistantSaved && assistant) applyWindowSnapshot(assistant, assistantSaved);

  for (const saved of state.windows) {
    try {
    if (saved.kind === "notepad") {
      const note = windows[openNotepad(saved.id)];
      note.ta.value = String(saved.text || "");
      applyWindowSnapshot(note, saved);
    } else if (saved.kind === "code_editor" && saved.sandboxId) {
      const id = Number(saved.id);
      nextWindowId = Math.max(nextWindowId, id + 1);
      const workspace = saved.workspaceId ? await chooseWorkspace(saved.workspaceId) : await workspaceForSandbox(String(saved.sandboxId));
      const ed = openEditorWindow(id, workspace.container, workspace.workspace_id);
      ed.errorLog = Array.isArray(saved.errorLog) ? saved.errorLog.slice(-100) : [];
      if (ed.errorLog.length) {
        ed.errors.textContent = ed.errorLog.join("\n\n");
        ed.errorToggle.textContent = `Errors (${ed.errorLog.length})`;
        ed.errorToggle.classList.add("has-errors");
      }
      applyWindowSnapshot(ed, saved);
      await refreshTree(ed);
      if (saved.current) await openFileInViewer(ed, String(saved.current));
      if (saved.draft !== undefined) { ed.code.value = saved.draft; ed.savedContent = saved.savedContent; ed.dirty = true; }
    } else if (saved.kind === "terminal" && saved.workspaceId) {
      try { const t = await workspaceTerminal(saved.workspaceId, saved.terminalId, Number(saved.id)); applyWindowSnapshot(t, saved); }
      catch (error) { feed("sys", `* Could not restore terminal: ${error.message}`); }
    } else if (saved.kind === "browser" && saved.browserId) {
      try {
        const state = await api("GET", `/api/browser/${saved.browserId}`);
        const browser = openBrowserWindow(
          Number(saved.id), String(saved.browserId), state.url || saved.url);
        applyWindowSnapshot(browser, saved);
      } catch (error) {
        console.warn("could not restore Chromium session", saved.browserId, error);
      }
    }
    } catch (error) { feed("sys", `* Could not restore ${saved.kind}: ${error.message}`); }
  }
  currentWorkspaceId = state.currentWorkspaceId || currentWorkspaceId;
  nextWindowId = Math.max(nextWindowId, Number(state.nextWindowId) || 1);
  return true;
}

async function recoverExistingSandboxes() {
  try {
    const state = await api("GET", "/api/sandboxes");
    for (const sandboxId of state.active || []) {
      const tree = await api("GET", `/api/sandbox/${sandboxId}/tree`);
      if (!tree.files?.length) continue;
      const id = nextWindowId++;
      const workspace = await workspaceForSandbox(sandboxId);
      const ed = openEditorWindow(id, workspace.container, workspace.workspace_id);
      ed.knownFiles = tree.files;
      renderTree(ed);
      await openFileInViewer(ed, `/workspace/${tree.files[0]}`);
      termLine(ed, "reattached existing sandbox after reload");
    }
  } catch (error) {
    console.warn("could not recover existing sandboxes", error);
  }
}

async function recoverExistingBrowsers() {
  try {
    const state = await api("GET", "/api/browsers");
    const attached = new Set(Object.values(windows)
      .filter(w => w.kind === "browser").map(w => w.browserId));
    for (const session of state.sessions || []) {
      if (attached.has(session.browser_id)) continue;
      openBrowserWindow(nextWindowId++, session.browser_id, session.url);
    }
  } catch (error) {
    console.warn("could not recover Chromium sessions", error);
  }
}

async function refreshTree(ed) {
  try {
    const r = await api("GET", `/api/sandbox/${ed.sandboxId}/tree`);
    ed.knownFiles = r.files;
    renderTree(ed);
  } catch (e) {
    recordSandboxError(ed, "refresh file tree", e.message);
  }
}

function renderTree(ed) {
  ed.tree.innerHTML = "";
  if (!ed.knownFiles.length) {
    ed.tree.innerHTML = '<div class="empty">(no files yet)</div>';
    return;
  }
  const seenDirs = new Set();
  for (const rel of ed.knownFiles) {
    const parts = rel.split("/");
    for (let d = 0; d < parts.length - 1; d++) {
      const dir = parts.slice(0, d + 1).join("/");
      if (seenDirs.has(dir)) continue;
      seenDirs.add(dir);
      const div = document.createElement("div");
      div.className = "titem";
      div.style.paddingLeft = 6 + d * 12 + "px";
      div.textContent = `📁 ${parts[d]}`;
      ed.tree.appendChild(div);
    }
    const div = document.createElement("div");
    const full = "/workspace/" + rel;
    div.className = "titem file" + (ed.current === full ? " sel" : "");
    div.style.paddingLeft = 6 + (parts.length - 1) * 12 + "px";
    div.textContent = `📄 ${parts[parts.length - 1]}`;
    div.title = rel;
    div.addEventListener("click", () => openFileInViewer(ed, full));
    ed.tree.appendChild(div);
  }
}

async function openFileInViewer(ed, full) {
  if (ed.dirty) { termLine(ed, "Save or discard your edits before switching files."); return; }
  if (!(full in ed.files)) {
    try {
      const r = await api("GET",
        `/api/sandbox/${ed.sandboxId}/file?path=${encodeURIComponent(full)}`);
      ed.files[full] = r.content;
    } catch (e) {
      termLine(ed, `cannot open ${full}: ${e.message}`);
      recordSandboxError(ed, `open ${full}`, e.message);
      return;
    }
  }
  showFile(ed, full);
}

function normPath(p) {
  p = String(p || "");
  return p.startsWith("/") ? p : "/workspace/" + p;
}
function showFile(ed, path) {
  if (!(path in ed.files)) return;
  ed.current = path;
  if (!ed.showingErrors)
    ed.curfile.textContent = path.replace("/workspace/", "");
  ed.code.value = ed.files[path];
  ed.savedContent = ed.files[path]; ed.dirty = false;
  renderTree(ed);
}
function setFile(ed, path, content) {
  ed.files[path] = content;
  const rel = path.replace("/workspace/", "");
  if (!ed.knownFiles.includes(rel)) {
    ed.knownFiles.push(rel);
    ed.knownFiles.sort();
  }
  showFile(ed, path);
}
function termLine(ed, text, cls) {
  termWrite(ed, text + "\n", cls);
}
function termWrite(ed, text, cls) {
  const s = document.createElement("span");
  if (cls) s.className = cls;
  s.textContent = text;
  ed.term.appendChild(s);
  ed.term.scrollTop = ed.term.scrollHeight;
}

async function streamExec(url, body, onOutput) {
  const r = await fetch(url, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(body),
  });
  if (!r.ok) {
    let detail = r.statusText;
    try { detail = (await r.json()).detail || detail; } catch (e) {}
    const error = new Error(detail);
    error.status = r.status;
    throw error;
  }
  if (!r.body) throw new Error("streaming responses are not supported by this browser");
  const reader = r.body.getReader();
  const decoder = new TextDecoder();
  let pending = "", result = null;
  while (true) {
    const { value, done } = await reader.read();
    pending += decoder.decode(value || new Uint8Array(), { stream: !done });
    const lines = pending.split("\n");
    pending = done ? "" : lines.pop();
    for (const line of lines) {
      if (!line) continue;
      const event = JSON.parse(line);
      if (event.type === "output") onOutput(event.data);
      else if (event.type === "done") result = event;
    }
    if (done) break;
  }
  if (!result) throw new Error("command stream ended without an exit status");
  return result;
}

function refreshBrowserScreenshot(browser) {
  if (!browser.win.el.isConnected || browser.win.minimized) return;
  const width = Math.min(4096, Math.round(browser.viewport.clientWidth));
  const height = Math.min(4096, Math.round(browser.viewport.clientHeight));
  if (width < 1 || height < 1) return;
  browser.shot.src = `/api/browser/${browser.browserId}/screenshot?width=${width}&height=${height}&t=${Date.now()}`;
}

async function refreshBrowserView(browser) {
  try {
    const state = await api("GET", `/api/browser/${browser.browserId}`);
    browser.url = state.url || browser.url;
    browser.address.value = browser.url;
    browser.title = state.title || "Chromium";
    browser.win.el.querySelector(".tname").textContent =
      `${browser.title.slice(0, 55)} - Chromium`;
    refreshBrowserScreenshot(browser);
    scheduleDesktopSave();
    return state;
  } catch (error) {
    browser.address.value = `Browser unavailable: ${error.message}`;
    return null;
  }
}

function openBrowserWindow(id, browserId, initialUrl = "about:blank") {
  let resizeObserver, resizeTimer;
  id = Number(id);
  nextWindowId = Math.max(nextWindowId, id + 1);
  const W = desktop.clientWidth, H = desktop.clientHeight;
  const win = makeWindow({
    title: `Chromium ${id}`, icon: "🌐",
    x: Math.round(W * 0.12), y: Math.round(H * 0.06),
    w: Math.round(W * 0.62), h: Math.round(H * 0.72),
    onClose: () => {
      resizeObserver?.disconnect(); clearTimeout(resizeTimer);
      Object.values(windows).find(w => w.browserId === browserId)?.executionCleanup?.();
      fetch(`/api/browser/${browserId}`, { method: "DELETE" }).catch(() => {});
      delete windows[id];
      feed("tool", `→ closed Chromium ${id}`);
    },
  });
  const bar = document.createElement("div");
  bar.className = "browser-bar";
  const back = document.createElement("button"); back.textContent = "←";
  const reload = document.createElement("button"); reload.textContent = "↻";
  const address = document.createElement("input");
  address.className = "browser-address"; address.value = initialUrl;
  const viewport = document.createElement("div");
  viewport.className = "browser-viewport";
  const shot = document.createElement("img");
  shot.className = "browser-shot";
  shot.alt = "Headless Chromium page";
  viewport.append(shot); bar.append(back, reload, address);
  win.body.append(bar, viewport);
  const browser = { id, kind: "browser", title: `Chromium ${id}`, win,
                    browserId, url: initialUrl, address, shot, viewport };
  resizeObserver = new ResizeObserver(() => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(() => refreshBrowserScreenshot(browser), 120);
  });
  resizeObserver.observe(viewport);
  windows[id] = browser;
  configureBrowserExecution(browser);
  const navigateFromBar = async () => {
    try {
      await api("POST", `/api/browser/${browserId}/control`, {mode:"human"});
      await api("POST", `/api/browser/${browserId}/navigate`, { url: address.value, owner:"human" });
      await refreshBrowserView(browser);
    } catch (error) { address.value = `Navigation failed: ${error.message}`; }
  };
  address.addEventListener("keydown", event => {
    if (event.key === "Enter") navigateFromBar();
  });
  back.addEventListener("click", async () => {
    await api("POST", `/api/browser/${browserId}/control`, {mode:"human"});
    await api("POST", `/api/browser/${browserId}/back?owner=human`).catch(() => {});
    setTimeout(() => refreshBrowserView(browser), 300);
  });
  reload.addEventListener("click", () => navigateFromBar());
  refreshBrowserView(browser);
  scheduleDesktopSave();
  return browser;
}

async function createBrowserWindow(url = "about:blank") {
  const state = await api("POST", "/api/browser", { url: String(url || "about:blank") });
  const id = nextWindowId++;
  const browser = openBrowserWindow(id, state.browser_id, state.url);
  return browser;
}

const toolHandlers = {
  // ---- generic window management (any window) ----
  async open_window({ app_type }) {
    const app = APPS[String(app_type)];
    if (!app)
      return `error: unknown app_type "${app_type}"; available: ${Object.keys(APPS).join(", ")}`;
    const [id, msg] = await app.open();
    feed("tool", `→ opened ${app_type} (window ${id})`);
    return msg;
  },
  get_desktop_state() {
    const list = Object.values(windows).map(w => {
      const info = {
        window_id: w.id, kind: w.kind, title: w.title,
        x: w.win.el.offsetLeft, y: w.win.el.offsetTop,
        width: w.win.el.offsetWidth, height: w.win.el.offsetHeight,
        minimized: w.win.minimized,
      };
      if (w.kind === "notepad") info.chars = w.ta.value.length;
      if (w.kind === "code_editor") info.files = w.knownFiles;
      if (w.workspaceId) info.workspace_id = w.workspaceId;
      if (w.terminalId) info.terminal_id = w.terminalId;
      if (w.kind === "browser") info.url = w.url;
      return info;
    });
    feed("tool", `→ reported desktop state (${list.length} window(s))`);
    return JSON.stringify({
      desktop: { width: desktop.clientWidth, height: desktop.clientHeight },
      note: "a window at (x,y) with size (w,h) fits while x <= desktop.width - w and y <= desktop.height - h",
      windows: list,
    });
  },
  snap_window({window_id, layout}) {
    const [w, err] = requireWindow(window_id);
    if (err) return err;
    try { w.win.snap(layout); }
    catch (error) { return `error: ${error.message}`; }
    return `Window ${w.id}: ${layout}.`;
  },
  move_window({ window_id, x, y }) {
    const [w, err] = requireWindow(window_id);
    if (err) return err;
    if (w.win.minimized) w.win.restore();
    w.win.clearSnap();
    const maxX = Math.max(0, desktop.clientWidth - w.win.el.offsetWidth);
    const maxY = Math.max(0, desktop.clientHeight - w.win.el.offsetHeight);
    const nx = Math.min(Math.max(0, Math.round(Number(x))), maxX);
    const ny = Math.min(Math.max(0, Math.round(Number(y))), maxY);
    w.win.el.style.left = nx + "px";
    w.win.el.style.top = ny + "px";
    w.win.el.style.zIndex = ++zTop;
    feed("tool", `→ moved window ${w.id} to (${nx}, ${ny})`);
    return `Moved ${w.title} so its top-left corner is at (${nx}, ${ny}).`;
  },
  resize_window({ window_id, width, height }) {
    const [w, err] = requireWindow(window_id);
    if (err) return err;
    if (w.win.minimized) w.win.restore();
    w.win.clearSnap();
    const nw = Math.min(Math.max(180, Math.round(Number(width))), desktop.clientWidth);
    const nh = Math.min(Math.max(100, Math.round(Number(height))), desktop.clientHeight);
    w.win.el.style.width = nw + "px";
    w.win.el.style.height = nh + "px";
    w.win.el.style.zIndex = ++zTop;
    feed("tool", `→ resized window ${w.id} to ${nw}x${nh}`);
    return `Resized ${w.title} to ${nw}x${nh} px.`;
  },
  minimize_window({ window_id }) {
    const [w, err] = requireWindow(window_id);
    if (err) return err;
    const r = w.win.minimize();
    feed("tool", `→ minimized window ${w.id}`);
    return `${w.title}: ${r}.`;
  },
  restore_window({ window_id }) {
    const [w, err] = requireWindow(window_id);
    if (err) return err;
    w.win.restore();
    w.win.el.style.zIndex = ++zTop;
    feed("tool", `→ restored window ${w.id}`);
    return `${w.title} restored.`;
  },
  close_window({ window_id }) {
    const [w, err] = requireWindow(window_id);
    if (err) return err;
    if (w.kind === "assistant")
      return "error: the assistant window cannot be closed";
    if (w.win.close() === false) return "error: save or discard human edits before closing";
    feed("tool", `→ closed window ${w.id}`);
    return `Closed ${w.title}` +
           (["code_editor", "terminal"].includes(w.kind) ? "; workspace files and running commands are preserved."
            : w.kind === "browser" ? " and stopped its isolated Chromium session."
            : ".");
  },

  // ---- notepads ----
  write_note({ window_id, note_to_write }) {
    const [w, err] = requireWindow(window_id, "notepad");
    if (err) return err;
    if (w.win.minimized) w.win.restore();
    w.ta.value += (w.ta.value ? "\n" : "") + String(note_to_write ?? "");
    w.ta.scrollTop = w.ta.scrollHeight;
    feed("tool", `→ wrote to notepad ${w.id}`);
    return `Wrote the note into notepad ${w.id}.`;
  },
  read_notepad({ window_id }) {
    const [w, err] = requireWindow(window_id, "notepad");
    if (err) return err;
    feed("tool", `→ read notepad ${w.id}`);
    return w.ta.value
      ? `Notepad ${w.id} contents:\n${w.ta.value}`
      : `Notepad ${w.id} is empty.`;
  },
  edit_notepad({ window_id, old_string, new_string }) {
    const [w, err] = requireWindow(window_id, "notepad");
    if (err) return err;
    const oldText = String(old_string ?? "");
    if (!oldText) return "error: old_string must not be empty";
    const occurrences = w.ta.value.split(oldText).length - 1;
    if (!occurrences)
      return `error: old_string not found in notepad ${w.id}; notepad unchanged. ` +
             "Read it with read_notepad before editing.";
    w.ta.value = w.ta.value.replace(oldText, String(new_string ?? ""));
    if (w.win.minimized) w.win.restore();
    w.win.el.style.zIndex = ++zTop;
    w.ta.scrollTop = w.ta.scrollHeight;
    feed("tool", `→ edited notepad ${w.id}`);
    return occurrences > 1
      ? `Edited notepad ${w.id}; replaced the first of ${occurrences} occurrences.`
      : `Edited notepad ${w.id}.`;
  },

  // ---- isolated headless Chromium ----
  async open_browser({ url }) {
    const browser = await createBrowserWindow(url || "about:blank");
    feed("tool", `→ opened Chromium ${browser.id}`);
    return `Opened isolated Chromium window ${browser.id} at ${browser.url}. ` +
           "Use browser_exec as the primary tool; inspect DOM/accessibility state before interacting.";
  },
  async browser_navigate({ window_id, url }) {
    const [browser, err] = requireWindow(window_id, "browser");
    if (err) return err;
    const state = await api("POST", `/api/browser/${browser.browserId}/navigate`,
                            { url: String(url) });
    await refreshBrowserView(browser);
    if (browser.win.minimized) browser.win.restore();
    browser.win.el.style.zIndex = ++zTop;
    feed("tool", `→ Chromium ${browser.id} navigated to ${state.url}`);
    return `Navigated Chromium ${browser.id} to ${state.url} (${state.title || "untitled"}).`;
  },
  async browser_read_page({ window_id }) {
    const [browser, err] = requireWindow(window_id, "browser");
    if (err) return err;
    const page = await api("GET", `/api/browser/${browser.browserId}/inspect`);
    await refreshBrowserView(browser);
    feed("tool", `→ inspected Chromium ${browser.id}`);
    return JSON.stringify({ title: page.title, url: page.url,
      text: page.text, interactive_elements: page.elements });
  },
  async browser_click({ window_id, element_id }) {
    const [browser, err] = requireWindow(window_id, "browser");
    if (err) return err;
    const state = await api("POST", `/api/browser/${browser.browserId}/click`,
                            { element_id: String(element_id) });
    await refreshBrowserView(browser);
    feed("tool", `→ clicked ${element_id} in Chromium ${browser.id}`);
    return `Clicked ${element_id}; page is now ${state.title || "untitled"} at ${state.url}. ` +
           "Call browser_read_page again before the next interaction.";
  },
  async browser_type({ window_id, element_id, text, press_enter }) {
    const [browser, err] = requireWindow(window_id, "browser");
    if (err) return err;
    const state = await api("POST", `/api/browser/${browser.browserId}/type`, {
      element_id: String(element_id), text: String(text ?? ""),
      press_enter: Boolean(press_enter),
    });
    await refreshBrowserView(browser);
    feed("tool", `→ typed into ${element_id} in Chromium ${browser.id}`);
    return `Typed into ${element_id}${press_enter ? " and pressed Enter" : ""}; ` +
           `page is ${state.title || "untitled"} at ${state.url}.`;
  },
  async browser_back({ window_id }) {
    const [browser, err] = requireWindow(window_id, "browser");
    if (err) return err;
    const state = await api("POST", `/api/browser/${browser.browserId}/back`);
    await refreshBrowserView(browser);
    feed("tool", `→ Chromium ${browser.id} went back`);
    return `Went back to ${state.url} (${state.title || "untitled"}).`;
  },

  // ---- code editors ----
  async create_file({ window_id, path, content }) {
    const [ed, err] = requireWindow(window_id, "code_editor");
    if (err) return err;
    if (ed.dirty) return "error: user has unsaved edits; save or discard them first";
    const r = await api("POST", `/api/sandbox/${ed.sandboxId}/file`,
                        { path: String(path), content: String(content ?? "") });
    setFile(ed, r.path, String(content ?? ""));
    termLine(ed, `wrote ${r.path} (${r.bytes} bytes)`);
    feed("tool", `→ created ${r.path} in editor ${ed.id}`);
    return `Created ${r.path} (${r.bytes} bytes).`;
  },
  async edit_file({ window_id, path, old_string, new_string }) {
    const [ed, err] = requireWindow(window_id, "code_editor");
    if (err) return err;
    if (ed.dirty) return "error: user has unsaved edits; save or discard them first";
    const r = await api("PATCH", `/api/sandbox/${ed.sandboxId}/file`,
                        { path: String(path), old_string: String(old_string ?? ""),
                          new_string: String(new_string ?? "") });
    if (!r.replaced)
      return `error: old_string not found in ${r.path}; file unchanged. ` +
             `Read it with run_bash (cat) or recreate it with create_file.`;
    setFile(ed, r.path, r.content);
    termLine(ed, `edited ${r.path}`);
    feed("tool", `→ edited ${r.path} in editor ${ed.id}`);
    return r.occurrences > 1
      ? `Replaced the first of ${r.occurrences} occurrences in ${r.path}.`
      : `Edited ${r.path}.`;
  },
  async open_file({ window_id, path }) {
    const [ed, err] = requireWindow(window_id, "code_editor");
    if (err) return err;
    if (ed.dirty) return "error: user has unsaved edits; save or discard them first";
    const full = normPath(path);
    let r;
    try {
      r = await api("GET",
        `/api/sandbox/${ed.sandboxId}/file?path=${encodeURIComponent(full)}`);
    } catch (e) {
      return `error: cannot open ${full}: ${e.message}`;
    }
    ed.files[full] = r.content;
    if (ed.win.minimized) ed.win.restore();
    ed.win.el.style.zIndex = ++zTop;
    showFile(ed, full);
    refreshTree(ed);
    feed("tool", `→ showing ${full} in editor ${ed.id}`);
    return `Now showing ${full} (${r.content.length} chars) in editor ${ed.id}.`;
  },
  async show_image({ window_id, path }) {
    const [ed, err] = requireWindow(window_id, "code_editor");
    if (err) return err;
    const full = normPath(path);
    const rel = full.replace("/workspace/", "");
    const url = `/api/sandbox/${ed.sandboxId}/raw?path=${encodeURIComponent(full)}&t=${Date.now()}`;
    let v = Object.values(windows).find(
      w => w.kind === "image_viewer" && w.src === full && w.sandboxId === ed.sandboxId);
    if (!v) {
      v = openImageViewer(rel);
      v.src = full;
      v.sandboxId = ed.sandboxId;
    }
    v.img.src = url;
    if (v.win.minimized) v.win.restore();
    v.win.el.style.zIndex = ++zTop;
    feed("tool", `→ showing image ${rel} (window ${v.id})`);
    return `Showing ${full} in an image viewer, window_id ${v.id}. It refreshes each time you call show_image on the same path.`;
  },
  async open_preview({ window_id, path }) {
    const [ed, err] = requireWindow(window_id, "code_editor");
    if (err) return err;
    let port;
    try {
      port = (await api("GET", `/api/sandbox/${ed.sandboxId}/port`)).host_port;
    } catch (e) {
      return `error: ${e.message}`;
    }
    const target = `http://127.0.0.1:${port}${path ? String(path) : "/"}`;
    let v = Object.values(windows).find(
      w => w.kind === "preview" && w.sandboxId === ed.sandboxId);
    if (!v) {
      v = openPreviewWindow();
      v.sandboxId = ed.sandboxId;
    }
    v.frame.src = target;
    v.url.textContent = target;
    if (v.win.minimized) v.win.restore();
    v.win.el.style.zIndex = ++zTop;
    feed("tool", `→ preview of ${target} (window ${v.id})`);
    return `Opened a live preview, window_id ${v.id}, showing ${target} — the sandbox's port 8000 mapped to the host. A server must be listening on port 8000 inside the sandbox or the page will fail to load.`;
  },
  async run_bash({ window_id, command }) {
    const [ed, err] = requireWindow(window_id, "code_editor");
    if (err) return err;
    const terminal = await workspaceTerminal(ed.workspaceId);
    const task = await startTerminalCommand(terminal, command);
    termLine(ed, `$ ${command}\nRunning task ${task.task_id} in Terminal window ${terminal.id}.`);
    return JSON.stringify({...task, note: "Command started; use list_tasks and read_terminal for the result. Closing views does not cancel it."});
  },
};

        parameters: { type: "object", properties: { ...winId,

}

// ================= assistant window + feed =================
let assistantWin, feedEl, statusEl, perfEl;
const training = new TrainingRecorder({
  socket: () => ws, defaultEnabled: true, key: "retrovoice-record-training-v1",
  metadata: () => ({app: "retrovoice", tab_id: tabId, frontend_version: frontendVersion,
    mic_settings: micStream?.getAudioTracks()[0]?.getSettings(),
    mic_context_rate: micCtx?.sampleRate, user_agent: navigator.userAgent}),
  state: () => Object.values(windows).map(w => ({...windowSnapshot(w),
    shown_code: w.kind === "code_editor" ? w.code.value : undefined})),
});
setInterval(() => { training.snapshot("periodic"); training.event("clock"); }, 2000);
for (const event of ["input", "change", "pointerup", "focusin"]) {
  document.addEventListener(event, e => {
    if (!e.isTrusted || !training.active || e.target.closest("#assistant")) return;
    const w = Object.values(windows).find(w => w.win.el.contains(e.target));
    training.event("human_interaction", {event, window_id: w?.id,
      selection_start: e.target.selectionStart, selection_end: e.target.selectionEnd});
    training.snapshot("human_interaction");
  }, true);
}
function buildAssistantWindow() {
  const W = desktop.clientWidth, H = desktop.clientHeight;
  assistantWin = makeWindow({
    title: "Assistant.exe", icon: "🎙️",
    x: W - Math.round(W / 3) - 16, y: H - Math.round(H / 2.6) - 16,
    w: Math.round(W / 3), h: Math.round(H / 2.6),
  });
  statusEl = document.createElement("div");
  statusEl.id = "statusline";
  statusEl.textContent = "connecting…";
  perfEl = document.createElement("div");
  perfEl.id = "perfline";
  perfEl.textContent = "⏱ waiting for first turn";
  perfEl.title = "Per-turn timing: model, tools, speech synthesis, and total";
  feedEl = document.createElement("div");
  feedEl.id = "feed";
  assistantWin.body.id = "assistant-body";
  assistantWin.el.id = "assistant";
  assistantWin.body.append(statusEl, perfEl);
  training.controls(assistantWin.body);
  assistantWin.body.append(feedEl);
  const id = nextWindowId++;
  windows[id] = { id, kind: "assistant", title: "Assistant.exe", win: assistantWin };
}
function feed(cls, text) {
  const d = document.createElement("div");
  d.className = cls;
  d.textContent = text;
  feedEl.appendChild(d);
  while (feedEl.childElementCount > 400) feedEl.firstChild.remove();
  feedEl.scrollTop = feedEl.scrollHeight;
  return d;
}
function shortMs(value) {
  if (value == null) return "—";
  return value >= 1000 ? `${(value / 1000).toFixed(1)}s` : `${Math.round(value)}ms`;
}
function showTurnMetrics(m) {
  const text = `⏱ input ${shortMs(m.input_ms)} · action ${shortMs(m.first_action_ms)}` +
    ` · model ${shortMs(m.model_ms)}` +
    ` · tools ${shortMs(m.tool_ms)} · TTS ${shortMs(m.tts_ms)}` +
    ` · total ${shortMs(m.total_ms)}`;
  perfEl.textContent = text;
  perfEl.title = JSON.stringify(m, null, 2);
  if (m.status === "completed") feed("perf", text);
}
function setStatus() {
  if (!statusEl) return;
  const dot = document.getElementById("micdot");
  dot.className = "";
  if (isSpeaking()) { statusEl.textContent = "🔊 assistant speaking"; dot.className = "hot"; }
  else if (thinking) { statusEl.textContent = "🤔 thinking…"; dot.className = "live"; }
  else if (userSpeaking) { statusEl.textContent = "👂 hearing you"; dot.className = "hot"; }
  else { statusEl.textContent = micStream ? "🎙️ listening" : "Manual mode · microphone off"; dot.className = "live"; }
}
setInterval(setStatus, 120);

// ================= audio =================
function b64FromFloat32(f32) {
  const u8 = new Uint8Array(f32.buffer, f32.byteOffset, f32.byteLength);
  let s = "";
  for (let i = 0; i < u8.length; i += 0x8000)
    s += String.fromCharCode.apply(null, u8.subarray(i, i + 0x8000));
  return btoa(s);
}
function f32FromB64(b64) {
  const bin = atob(b64);
  const u8 = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) u8[i] = bin.charCodeAt(i);
  return new Float32Array(u8.buffer);
}
function resample(f32, from, to) {
  if (from === to) return f32;
  const n = Math.round(f32.length * to / from);
  const out = new Float32Array(n);
  for (let i = 0; i < n; i++) {
    const x = i * (f32.length - 1) / (n - 1);
    const l = Math.floor(x), r = Math.min(l + 1, f32.length - 1);
    out[i] = f32[l] + (f32[r] - f32[l]) * (x - l);
  }
  return out;
}
function enqueueAudio(f32, message) {
  const buf = playCtx.createBuffer(1, f32.length, TTS_SR);
  buf.copyToChannel(f32, 0);
  const src = playCtx.createBufferSource();
  src.buffer = buf;
  src.connect(playCtx.destination);
  const t = Math.max(playCtx.currentTime + 0.06, playhead);
  training.playback(src, playCtx, t, f32.length, TTS_SR, {utt: message.utt, seq: message.seq});
  src.start(t);
  playhead = t + buf.duration;
  sources.push(src);
  if (sources.length > 64) sources = sources.slice(-64);
}
function stopPlayback() {
  sources.forEach(s => { s.traceStopped = true; s.traceStopTime = playCtx?.currentTime; try { s.stop(); } catch (e) {} });
  sources = []; playhead = 0;
}
const isSpeaking = () => playCtx && playhead > playCtx.currentTime + 0.02;

async function startMic() {
  micStream = await navigator.mediaDevices.getUserMedia({
    audio: { echoCancellation: true, noiseSuppression: true,
             autoGainControl: true, channelCount: 1 } });
  micCtx = new AudioContext({ sampleRate: MIC_SR });
  const code = `class M extends AudioWorkletProcessor {
    process(i) { const c = i[0] && i[0][0]; if (c) this.port.postMessage(c.slice(0)); return true; } }
    registerProcessor("m", M);`;
  await micCtx.audioWorklet.addModule(
    URL.createObjectURL(new Blob([code], { type: "application/javascript" })));
  const src = micCtx.createMediaStreamSource(micStream);
  const node = new AudioWorkletNode(micCtx, "m");
  src.connect(node);
  let acc = [], accLen = 0, captureSamples = 0, packetSeq = 0;
  const target = Math.round(micCtx.sampleRate * 0.128);
  node.port.onmessage = e => {
    acc.push(e.data); accLen += e.data.length;
    if (accLen >= target) {
      const joined = new Float32Array(accLen);
      let off = 0;
      for (const f of acc) { joined.set(f, off); off += f.length; }
      acc = []; accLen = 0;
      const pcm = resample(joined, micCtx.sampleRate, MIC_SR);
      const captureStart = captureSamples;
      captureSamples += pcm.length;
      const seq = packetSeq++;
      if (ws && ws.readyState === 1) ws.send(JSON.stringify({ type: "audio",
        seq, capture_start_sample: captureStart, client_session_id: training.clientSessionId,
        client_monotonic_ms: performance.now(), mic_context_s: micCtx.currentTime,
        data: b64FromFloat32(pcm) }));
    }
  };
}

// ================= websocket =================
let reconnectTimer = null;
let reconnectAttempts = 0;
let appStarted = false;
function connect() {
  if (!appStarted || (ws && [WebSocket.CONNECTING, WebSocket.OPEN].includes(ws.readyState)))
    return;
  clearTimeout(reconnectTimer);
  ws = new WebSocket(SERVER);
  ws.onopen = () => {
    feed("sys", reconnectAttempts ? "* reconnected to speech server" :
                                      "* connected to speech server");
    reconnectAttempts = 0;
  };
  ws.onclose = () => {
    training.disconnected();
    statusEl.textContent = "❌ disconnected — reconnecting…";
    if (reconnectAttempts === 0) feed("sys", "* connection closed; reconnecting");
    reconnectAttempts += 1;
    const delay = Math.min(5000, 500 * 2 ** Math.min(reconnectAttempts, 4));
    reconnectTimer = setTimeout(connect, delay);
  };
  ws.onerror = () => { /* onclose schedules the retry without log spam */ };
  ws.onmessage = e => handle(JSON.parse(e.data));
}
function handle(m) {
  training.handle(m);
  switch (m.type) {
    case "ready": {
      const short = (m.llm_model || "?").split("/").pop();
      const tname = assistantWin.el.querySelector(".tname");
      tname.textContent = `Assistant.exe — ${short}`;
      tname.title = m.llm_model;
      feed("sys", `* llm: ${m.llm_model}`);
      ws.send(JSON.stringify({ type: "register_tools",
        tools: toolSchemas(), instructions: INSTRUCTIONS }));
      break;
    }
    case "tools_registered":
      feed("sys", `* desktop tools registered: ${m.names.join(", ")}`);
      break;
    case "vad":
      if (m.data === "speech_start") {
        userSpeaking = true;
        if (isSpeaking()) stopPlayback();
      } else if (m.data === "speech_end") userSpeaking = false;
      break;
    case "endpoint":
      if (m.data === "done") { userSpeaking = false; thinking = true; }
      break;
    case "transcription":
      thinking = true; userSpeaking = false;
      training.feedback(feed("you", `You: ${m.data}`),
        {kind: "transcript", text: m.data, speech_id: m.speech_id});
      break;
    case "chat_chunk":
      if (interruptedUtts.has(m.utt)) break;
      thinking = false;
      feed("bot", `Assistant: ${m.data}`);
      break;
    case "audio_chunk":
      if (!interruptedUtts.has(m.utt) && m.pcm) enqueueAudio(f32FromB64(m.pcm), m);
      break;
    case "chat_done":
      thinking = false;
      training.feedback(feed("sys", "Response feedback"), {kind: "response", utt: m.utt});
      break;
    case "tool_result":
      training.feedback(feed("tool", `→ ${m.name}: ${m.preview || ""}`),
        {kind: "tool", call_id: m.action_id, utt: m.utt});
      break;
    case "tool_call": {
      thinking = true;
      feed("tool", `⚙ ${m.name}(${(m.args || "").slice(0, 120)})`);
      if (m.call_id && toolHandlers[m.name]) {
        (async () => {
          const toolSocket = ws;
          const toolStarted = performance.now();
          training.snapshot("before_tool", {call_id: m.call_id, utt: m.utt});
          let result, args = {};
          try {
            args = m.args ? JSON.parse(m.args) : {};
            result = String(await toolHandlers[m.name](args));
          } catch (err) {
            result = `error: ${err.message}`;
          }
          const target = getWindow(args.window_id);
          if (target?.kind === "code_editor" && result.startsWith("error:"))
            recordSandboxError(target, m.name, result);
          training.snapshot("after_tool", {call_id: m.call_id, utt: m.utt});
          if (toolSocket.readyState === WebSocket.OPEN)
            toolSocket.send(JSON.stringify({ type: "tool_result",
                                     call_id: m.call_id, result,
                                     client_duration_ms:
                                       Math.round(performance.now() - toolStarted) }));
          else training.event("orphan_tool_result", {call_id: m.call_id, utt: m.utt, result});
        })();
      } else if (m.call_id && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify({ type: "tool_result", call_id: m.call_id,
          result: `error: no client handler for tool ${m.name}` }));
      }
      break;
    }
    case "turn_metrics":
      showTurnMetrics(m);
      break;
    case "interrupted":
      interruptedUtts.add(m.utt);
      stopPlayback();
      feed("sys", "* interrupted");
      thinking = false;
      break;
    case "history_trimmed":
      feed("sys", `* note: oldest ${m.dropped} messages dropped from model context`);
      break;
    case "error":
      feed("sys", `* server error: ${m.data}`);
      thinking = false;
      break;
  }
}

// ================= boot =================
Object.assign(toolHandlers, workspaceTools, advancedTools);
document.getElementById("startbtn").addEventListener("click", () => {
  if (!desktopStateReady) return;
  const existing = document.querySelector(".desktop-launcher");
  if (existing) { existing.remove(); return; }
  const menu = document.createElement("div"); menu.className = "desktop-launcher";
  for (const [name, app] of Object.entries(APPS)) menu.append(actionButton(name.replaceAll('_', ' '), async () => { menu.remove(); await app.open(); }));
  document.body.append(menu);
});
let bootInProgress = false;
async function bootApp(withMic) {
  if (bootInProgress) return;
  bootInProgress = true;
  try {
    playCtx = new AudioContext({ sampleRate: TTS_SR });
    if (withMic) await startMic();
  } catch (err) {
    document.getElementById("booterr").textContent =
      "Could not start audio: " + err.message;
    bootInProgress = false;
    return;
  }
  document.getElementById("bootstart").disabled = true;
  document.getElementById("bootmanual").disabled = true;
  document.getElementById("booterr").textContent = "Restoring desktop…";
  buildAssistantWindow();
  const restored = await restoreDesktopState();
  await recoverExistingBrowsers();
  desktopStateReady = true;
  document.getElementById("boot").remove();
  saveDesktopState();
  feed("sys", "* RetroVoice OS ready — try: “open a notepad”");
  appStarted = true;
  connect();
  if (!restored) openWorkspaceManager();
}
document.getElementById("bootstart").addEventListener("click", () => bootApp(true));
document.getElementById("bootmanual").addEventListener("click", () => bootApp(false));
</script>
